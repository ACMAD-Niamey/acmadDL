[project]
name = "acmadDL"
version = "0.2.0"
description = "Canonical data acquisition for seasonal climate forecasting"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "accord-research" }]
keywords = ["climate", "forecasting", "data-acquisition", "xarray", "cds", "chirps"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "xarray",
    "numpy",
    "netcdf4",
    "pyyaml",
    "scipy",
    "cdsapi>=0.7.7",
    "ecmwf-api-client>=1.6",
    "tqdm",
    "rioxarray",
    "sheerwater>=0.2.5",
    # Resolver guidance, not direct imports: these ride in via sheerwater ->
    # earthaccess. Without floors, pip 25.2/25.3 (as shipped by Anaconda)
    # explores the old earthaccess/s3fs/fsspec/aiobotocore version lattice for
    # ~40 minutes and aborts with resolution-too-deep; either floor alone
    # collapses the resolve to ~20s, both are kept as insurance. pip >= 26 and
    # uv are unaffected either way.
    "earthaccess>=0.18",
    "s3fs>=2025.2",
    "fsspec>=2025.2",
    "nuthatch>=0.4.9",
    "cfgrib>=0.9.15.1",
    "eccodeslib>=2.46.2.19",
]

[project.urls]
Homepage = "https://github.com/ACMAD-Niamey/acmadDL"
Repository = "https://github.com/ACMAD-Niamey/acmadDL"

[project.optional-dependencies]
# icechunk (versioned Zarr stores) powers the optional icechunk adapter. It
# needs zarr>=3, which conflicts with sheerwater's stale zarr==2.18.3 pin under
# plain pip, so it is opt-in. Under uv, the [tool.uv] override below lets
# `--extra icechunk` co-resolve both adapters into one environment.
icechunk = ["icechunk>=2"]
s3 = ["boto3"]
dev = ["pytest"]
demo = ["matplotlib", "cartopy", "rasterio"]
# Shapefile / geometry region input (acmaddl.fetch(region="x.shp")). rioxarray
# is already a core dep and rasterio rides in with it; geopandas is the only
# genuinely new requirement, kept optional because its stack is heavy.
geo = ["geopandas", "rasterio"]

[project.scripts]
acmaddl = "acmaddl.cli:cli"

[tool.uv]
# sheerwater's metadata hard-pins zarr==2.18.3, which blocks icechunk (needs
# zarr>=3) from co-resolving into the same environment. That pin is stale:
# sheerwater opens+reads its public Zarr stores correctly under zarr 3, verified
# end-to-end against real data by tests/test_sheerwater_integration.py. Override
# it so the icechunk and sheerwater adapters can live in one resolved env.
override-dependencies = ["zarr>=3.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src/rosetta is the deprecated import alias kept for the 0.1.x -> 0.2.0 rename
# (see src/rosetta/__init__.py); it is a redirect module, not a second copy.
packages = ["src/acmaddl", "src/rosetta"]
# Ship the package-local nuthatch.toml so it lands next to acmaddl's modules and
# shadows any ambient nuthatch config in site-packages (see src/acmaddl/nuthatch.toml).
force-include = { "src/acmaddl/nuthatch.toml" = "acmaddl/nuthatch.toml" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires network access",
    "cds: requires CDS credentials in ~/.cdsapirc",
    "network: requires live network access to remote data sources",
]

[tool.nuthatch]
# V1: root and local both point to the same local filesystem path.
# Public mirror is a V2 item.
[tool.nuthatch.root]
filesystem = "~/.nuthatch/acmaddl"
[tool.nuthatch.local]
filesystem = "~/.nuthatch/acmaddl"
