[project]
name = "acmadDL"
version = "0.2.0"
description = "Canonical data acquisition for seasonal climate forecasting"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "accord-research" }]
keywords = ["climate", "forecasting", "data-acquisition", "xarray", "cds", "chirps"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "xarray",
    "numpy",
    "netcdf4",
    "pyyaml",
    "scipy",
    "cdsapi>=0.7.7",
    "ecmwf-api-client>=1.6",
    "tqdm",
    "rioxarray",
    "sheerwater>=0.2.5",
    # Resolver guidance, not direct imports: these ride in via sheerwater ->
    # earthaccess. Without floors, pip 25.2/25.3 (as shipped by Anaconda)
    # explores the old earthaccess/s3fs/fsspec/aiobotocore version lattice for
    # ~40 minutes and aborts with resolution-too-deep; either floor alone
    # collapses the resolve to ~20s, both are kept as insurance. pip >= 26 and
    # uv are unaffected either way.
    "earthaccess>=0.18",
    "s3fs>=2025.2",
    "fsspec>=2025.2",
    "nuthatch>=0.4.9",
    "cfgrib>=0.9.15.1",
    "eccodeslib>=2.46.2.19",
]

[project.urls]
Homepage = "https://github.com/ACMAD-Niamey/acmadDL"
Repository = "https://github.com/ACMAD-Niamey/acmadDL"

[project.optional-dependencies]
# icechunk (versioned Zarr stores) powers the optional icechunk adapter. It
# needs zarr>=3, which conflicts with sheerwater's stale zarr==2.18.3 pin under
# plain pip, so it is opt-in. Under uv, the [tool.uv] override below lets
# `--extra icechunk` co-resolve both adapters into one environment.
icechunk = ["icechunk>=2"]
s3 = ["boto3"]
dev = ["pytest"]
demo = ["matplotlib", "cartopy", "rasterio"]
# Shapefile / geometry region input (acmaddl.fetch(region="x.shp")). rioxarray
# is already a core dep and rasterio rides in with it; geopandas is the only
# genuinely new requirement, kept optional because its stack is heavy.
geo = ["geopandas", "rasterio"]
# MCP server (`acmaddl-mcp`): exposes the catalog, health checks, fetch, and
# zonal as Model Context Protocol tools for AI agents. See README "MCP server".
mcp = ["mcp>=1.2"]

[project.scripts]
acmaddl = "acmaddl.cli:cli"
acmaddl-mcp = "acmaddl.mcp.server:main"

[tool.uv]
# sheerwater's metadata hard-pins zarr==2.18.3 and xarray==2025.1.0 (still true
# in sheerwater 0.2.10, 2026-05). Both pins are stale: sheerwater opens+reads its
# public Zarr stores correctly under zarr 3 and current xarray, verified end to
# end by tests/test_sheerwater_integration.py. zarr is overridden so icechunk
# (zarr>=3) co-resolves; xarray is overridden so the Rhiza weather-skills group
# (weather-skills-core needs xarray>=2026.7, dynamical-catalog>=2025.1.2) does.
override-dependencies = ["zarr>=3.1.0", "xarray>=2026.7"]

[tool.uv.sources]
# Rhiza weather-skills provider packages, pinned to commits (their `main` is a
# release branch that auto-bumps skill versions). Moving a pin: re-capture
# tests/fixtures/rhiza via scripts/capture_rhiza_fixtures.py and bump
# fetch._CACHE_VERSION (the raw-fetch cache key cannot see the pin).
weather-skills-core = { git = "https://github.com/rhiza-research/weather-skills-core", rev = "e118b9531181224cb1459efbd9f2b114117f0a79" }
weather-skills = { git = "https://github.com/rhiza-research/weather-skills", rev = "4f95364b323e601f5cbd43ee3af39d2d77617596" }
chc-skills = { git = "https://github.com/rhiza-research/chc-skills", rev = "20bce784a77a10a1fe7a368e29669a5d673eb176" }

[dependency-groups]
# `uv sync --group rhiza`: the adapters/rhiza.py adapter runs Rhiza's fetcher
# scripts in-process. A dependency GROUP rather than an extra because PyPI
# rejects published metadata that points at git URLs. Besides the three
# provider packages this lists what their scripts declare in PEP 723 headers.
rhiza = [
    "weather-skills-core",
    "weather-skills",
    "chc-skills",
    "ecmwf-datastores-client==0.4.2",
    "dynamical-catalog==0.5.0",
    "pint-xarray>=0.6",
    "cf-xarray>=0.11",
    "aiohttp",
    "dask",
    "gcsfs",
    "h5netcdf",
    "h5py",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src/rosetta is the deprecated import alias kept for the 0.1.x -> 0.2.0 rename
# (see src/rosetta/__init__.py); it is a redirect module, not a second copy.
packages = ["src/acmaddl", "src/rosetta"]
# Ship the package-local nuthatch.toml so it lands next to acmaddl's modules and
# shadows any ambient nuthatch config in site-packages (see src/acmaddl/nuthatch.toml).
force-include = { "src/acmaddl/nuthatch.toml" = "acmaddl/nuthatch.toml" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires network access",
    "cds: requires CDS credentials in ~/.cdsapirc",
    "network: requires live network access to remote data sources",
]

[tool.nuthatch]
# V1: root and local both point to the same local filesystem path.
# Public mirror is a V2 item.
[tool.nuthatch.root]
filesystem = "~/.nuthatch/acmaddl"
[tool.nuthatch.local]
filesystem = "~/.nuthatch/acmaddl"
