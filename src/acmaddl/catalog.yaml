# acmaddl product catalog.
#
# Coverage/ensemble field conventions (under each product's `grid:`):
#
#   hindcast_range: [start_year, end_year]
#     The model's REFORECAST (hindcast) period — the fixed historical window of
#     retrospective forecasts, a property of the model/system. It is NOT a data
#     cap: real-time forecasts run past it to the present, and NOTHING in acmaddl
#     uses this field to limit a fetch. For nmme/* split-stream models it doubles
#     as the hindcast<->forecast routing boundary; for c3s/* it is descriptive
#     metadata; for observations/reanalysis (obs/*) it denotes data coverage.
#     `null` means there is no fixed window (rolling live feeds, on-the-fly S2S).
#
#   forecast_range: [start_year, end_year_or_null]
#     The REAL-TIME forecast availability for the pinned system. A `null` end means
#     the stream is ongoing (forecasts to the present); a year means the stream
#     ENDED then — the pinned C3S system version was retired/superseded, so
#     hindcasts still fetch but no NEW forecasts are issued. Absent for
#     observations/reanalysis and the on-the-fly S2S reforecast.
#
#   forecast_members / hindcast_members:
#     Ensemble sizes for the real-time forecast and the reforecast respectively —
#     many systems run a larger ensemble in real time than in the hindcast.
#     Observations/reanalysis have neither.
#
#   Rhiza weather-skills products (`weather-skills/*`, adapter: weather_skills) run a skill script
#   from the pinned weather-skills / chc-skills packages in-process (see
#   adapters/weather_skills.py).
#   Entry knobs:
#     provider:        distribution holding the skill (default weather-skills)
#     skill:           skills/<skill>/scripts/*.py inside that distribution
#     entrypoint:      decorated function name (default fetch)
#     argv:            CLI template; fields {init} {bbox} {start} {end} {variable}.
#                      {init} marks a forecast (one issuance per fetch);
#                      {start}/{end} mark an observation window.
#     requires_region: true -> fetch() without region= is an error (ecmwf-fetch)
#     window_days:     observation fetchers without --bbox: chunk the window,
#                      crop each chunk to the bbox as it loads
#     credentials:     "ecds" maps CDSAPI/cdsapirc ECDS tokens to their env vars;
#                      "earthdata" requires an Earthdata Login token (~/.earthdatarc or EARTHDATA_TOKEN)
#                      (imerg-fetch would otherwise block on an interactive prompt)
#     probe_latest:    true, or a token list, for the remote health probe
#                      (also clips observation windows to the published latest day)
#     allow_future:    true -> observation windows may lie in the future (CMIP6 scenarios)
#     end_exclusive:   true -> the skill slices its time axis to `--end-time 00:00`
#                      (dynamical-fetch analyses): acmaddl asks for end+1 and trims back.
#                      Do not combine window_days with a sub-daily product: the same
#                      00:00 cut would drop steps at every chunk seam.
#   Member 0 of their ensembles is the control run and is kept. lead_time is a
#   timedelta (native steps). No reforecast stream exists through these entries.
#
nmme/cfsv2:
  adapter: opendap
  split_streams: true
  append_streams: true
  notes: "Genuine NMME CFSv2 reforecast is currently only available via the IRI Data Library; hindcast 1982-2010 + real-time forecast are stitched via append_streams."
  # NOTE: This uses PENTAD_SAMPLES/.MONTHLY which returns 28 members and all
  # 10 lead months per init.  When acmaddl.fetch() is called with init= and
  # target=, the OPeNDAP adapter automatically selects and averages only the
  # 3 leads corresponding to the target season (L = lead_month - 0.5).
  #
  # KNOWN ISSUE: pycpt/IRI uses PENTAD_SAMPLES_FULL (a different sub-collection)
  # with server-side member averaging.  The two datasets can diverge spatially
  # for predictor domains that include ocean/Atlantic cells (e.g. W Africa),
  # causing r(DS_gcm, IRI_gcm) < 1 and reduced cross-pipeline CCA agreement.
  # TODO: Switch source_url to PENTAD_SAMPLES_FULL once the OPeNDAP adapter
  # supports the required server-side lead + member averaging for that endpoint.
  # split_streams: the {stream} placeholder resolves to HINDCAST for in-range
  # years and FORECAST past hindcast_range[1]. The two streams are structurally
  # identical -- same 28 members, L=0.5..9.5 leads, 1deg global grid, and units
  # (verified against the live endpoints) -- so this is one dataset split only by
  # period. NB the real split is by MONTH, not year: HINDCAST runs through
  # ~2011-03 and FORECAST starts ~2011-04, so calendar year 2011 is physically
  # split across BOTH streams. hindcast_range/forecast_range below deliberately
  # OVERLAP at 2011 (see grid: block) so a boundary-spanning fetch requests 2011
  # from both streams; each stream's init-time (S) filter then contributes only
  # the inits it actually has (HINDCAST -> Jan-Mar 2011, FORECAST -> Apr-Dec
  # 2011), and the adapter unions them -- no inits are dropped.
  source_url: "https://iridl.ldeo.columbia.edu/SOURCES/.Models/.NMME/.NCEP-CFSv2/.{stream}/.PENTAD_SAMPLES/.MONTHLY"
  variables:
    precip:
      native_name: prec
      units: "mm/day"
      target_units: "mm"
      season_total_conversion: true
    temp:
      native_name: tref
      units: K
      target_units: C
    sst:
      native_name: sst
      units: K
      target_units: K
  # The endpoint advertises M=28, but live HINDCAST and FORECAST responses have
  # four structurally empty trailing slots. Preserve the 24 usable members.
  drop_empty_members: true
  grid:
    lat_res: 1.0
    lon_res: 1.0
    forecast_members: 24
    hindcast_members: 24
    hindcast_range: [1982, 2011]   # deliberately overlaps forecast_range at 2011, the true (month-granular) stream split -- see split_streams note above
    forecast_range: [2011, null]   # real-time, ongoing. Probe-verified: HINDCAST stream ends 2011-03, FORECAST starts 2011-04; both streams are fetched for 2011 and unioned (see _resolve_streams) so no inits are dropped

nmme/cfsv2-forecast:
  alias_of: "nmme/cfsv2"   # deprecated: forecast is the same product, forecast stream

# CCSM4 via IRI OPeNDAP (combined hindcast + forecast, 1982-present)
nmme/ccsm4-iri:
  alias_of: "nmme/ccsm4"   # deprecated: IRI DL route superseded by the CCSR route

nmme/geoss2s-forecast:
  alias_of: "nmme/geoss2s"   # deprecated: IRI DL forecast route superseded by CCSR

nmme/ccsm4-hindcast:
  alias_of: "nmme/ccsm4"   # deprecated: S3 hindcast superseded by the CCSR route

nmme/cesm1-hindcast:
  alias_of: "nmme/cesm1"   # deprecated: S3 hindcast superseded by the CCSR route

nmme/geoss2s-hindcast:
  alias_of: "nmme/geoss2s"   # deprecated: S3 hindcast superseded by the CCSR route

# CCSR (Columbia) NMME — the IRI Data Library successor. One canonical product
# per model (no -hindcast / -forecast / -iri / -ncei split); the source and the
# hindcast-vs-forecast stream are catalog/adapter details, not part of the id.
# CCSM4 serves one combined hindcast+forecast series; GEOSS2S/SPEAR/CanSIPS-IC4
# split into forecast/ and hindcast/ subdirs (split_streams: true).

nmme/ccsm4:
  adapter: ccsr
  single_year_fetch: true
  source_url: "https://forecast.ccsr.columbia.edu/data/NMME/COLA-RSMAS/CCSM4"
  variables:
    precip:
      native_name: pr
      units: "mm/day"
      target_units: "mm/day"   # rate per step; year_index=True delivers calendar-weighted mm totals (see #6)
    temp:
      native_name: tas
      # CCSR serves NMME 2 m temperature already in Celsius (declared
      # degree_Celsius since the 2026-07 CMIP rename; previously no units attr),
      # unlike the IRI/CDS sources which serve Kelvin. Declaring K here caused a
      # double K->C conversion in normalize() -> sub-absolute-zero values.
      units: C
      target_units: C
    sst:
      native_name: tos
      # The CMIP rename also switched SST from Kelvin to Celsius on the
      # server; normalize converts back so the delivered contract stays K.
      units: C
      target_units: K
  grid:
    lat_res: 1.0
    lon_res: 1.0
    forecast_members: 10
    hindcast_members: 10
    hindcast_range: [1982, 2026]
    forecast_range: [2014, null]   # real-time, ongoing

# CESM1 (COLA-RSMAS): combined hindcast+forecast like CCSM4. Migrated from the
# acc.ord S3 archive (nmme/cesm1-hindcast, now a deprecated alias) to CCSR.
nmme/cesm1:
  adapter: ccsr
  single_year_fetch: true   # per-year DAP requests; the full-range hindcast request overflows the
                            # CCSR server and silently zero-fills (matches ccsm4). See safe_fetch.
  source_url: "https://forecast.ccsr.columbia.edu/data/NMME/COLA-RSMAS/CESM1"
  variables:
    precip:
      native_name: pr
      units: "mm/day"
      target_units: "mm/day"   # rate per step; year_index=True delivers calendar-weighted mm totals (see #6)
    temp:
      native_name: tas
      # CCSR serves NMME 2 m temperature already in Celsius (declared
      # degree_Celsius since the 2026-07 CMIP rename; previously no units attr),
      # unlike the IRI/CDS sources which serve Kelvin. Declaring K here caused a
      # double K->C conversion in normalize() -> sub-absolute-zero values.
      units: C
      target_units: C
    sst:
      native_name: tos
      # The CMIP rename also switched SST from Kelvin to Celsius on the
      # server; normalize converts back so the delivered contract stays K.
      units: C
      target_units: K
  grid:
    lat_res: 1.0
    lon_res: 1.0
    forecast_members: 10
    hindcast_members: 10
    hindcast_range: [1982, 2026]
    forecast_range: [2017, null]   # real-time, ongoing (start approx)

nmme/geoss2s:
  adapter: ccsr
  single_year_fetch: true   # per-year DAP requests; the full-range hindcast request overflows the
                            # CCSR server and silently zero-fills (matches ccsm4). See safe_fetch.
  source_url: "https://forecast.ccsr.columbia.edu/data/NMME/NASA-GMAO/GEOSS2S"
  split_streams: true
  variables:
    precip:
      native_name: pr
      units: "mm/day"
      target_units: "mm/day"   # rate per step; year_index=True delivers calendar-weighted mm totals (see #6)
    temp:
      native_name: tas
      # CCSR serves NMME 2 m temperature already in Celsius (declared
      # degree_Celsius since the 2026-07 CMIP rename; previously no units attr),
      # unlike the IRI/CDS sources which serve Kelvin. Declaring K here caused a
      # double K->C conversion in normalize() -> sub-absolute-zero values.
      units: C
      target_units: C
    sst:
      native_name: tos
      # The CMIP rename also switched SST from Kelvin to Celsius on the
      # server; normalize converts back so the delivered contract stays K.
      units: C
      target_units: K
  grid:
    lat_res: 1.0
    lon_res: 1.0
    forecast_members: 10   # real-time forecast runs a larger ensemble than the hindcast (verified live 2026-06: NASA-GMAO/GEOSS2S/forecast M=10)
    hindcast_members: 4
    hindcast_range: [1981, 2017]
    forecast_range: [2019, null]   # real-time, ongoing

# --- c3s/* : Copernicus Climate Data Store (CDS) seasonal systems ---
# PROVENANCE: original. The CDS is the official distribution channel for these
# centres' seasonal forecasts (ECMWF/SEAS5, CMCC, DWD, Météo-France, UKMO, JMA,
# ECCC), so these are original-source entries — acmaddl's preferred kind. (Note
# some models also appear under nmme/* as the NMME-program copy; e.g. CanSIPS is
# here as c3s/eccc-cansips* and under nmme/cansipsic4 via the CCSR aggregator.)
c3s/ecmwf:
  adapter: cds
  cds_dataset: "seasonal-original-single-levels"
  cds_model: "ecmwf"
  system: "51"
  variables:
    precip:
      native_name: total_precipitation
      short_name: tp
      units: m
      target_units: "mm/day"
      accumulated: true
    temp:
      native_name: 2m_temperature
      short_name: t2m
      units: K
      target_units: C
    sst:
      native_name: sea_surface_temperature
      units: K
      target_units: K
  grid:
    lat_res: 1.0
    lon_res: 1.0
    forecast_members: 51
    hindcast_members: 25
    hindcast_range: [1981, 2016]
    forecast_range: [2017, null]   # real-time, ongoing (verified)

