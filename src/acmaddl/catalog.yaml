  requires_region: true
  credentials: ecds
  probe_latest: true
  variables:
    precip: {native_name: tp, units: "mm/day", target_units: "mm/day"}
    temp: {native_name: t2m, units: C, target_units: C}
    sst: {native_name: sst, units: C, target_units: C}
    d2m: {native_name: d2m, units: C, target_units: C}
    mx2t6: {native_name: mx2t6, units: C, target_units: C}
    mn2t6: {native_name: mn2t6, units: C, target_units: C}
    u10: {native_name: u10, units: "m/s", target_units: "m/s"}
    v10: {native_name: v10, units: "m/s", target_units: "m/s"}
    msl: {native_name: msl, units: Pa, target_units: Pa}
    cape: {native_name: cape, units: "J/kg", target_units: "J/kg"}
    tcw: {native_name: tcw, units: "kg/m2", target_units: "kg/m2"}
  grid:
    lat_res: 1.5
    lon_res: 1.5
    hindcast_range: null
    forecast_range: [2023, null]
    forecast_members: 101
    temporal: daily
  notes: >-
    Rhiza weather-skills ecmwf-fetch: ECMWF S2S real-time forecast from the ECMWF Data
    Store, 46 daily steps, control (member 0) + 100 perturbed. Needs ECDS credentials
    (ECMWF_DATASTORES_URL/KEY, ~/.ecmwfdatastoresrc, or an ECDS-pointing ~/.cdsapirc);
    2-day embargo on real-time inits. One issuance per fetch (init='YYYY-MM-DD'); no
    reforecast stream -- for hindcasts use c3s/ecmwf-s2s with reforecast=True.
    Precipitation is a per-step rate (mm/day). SST in degrees C (most acmaddl SST is K).

