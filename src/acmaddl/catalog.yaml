    Rhiza weather-skills dynamical-fetch: NASA IMERG late-run half-hourly precipitation
    analysis, credential-free. Call with hindcast=(y, y) and months=[...]; without
    hindcast the trailing 10 days are fetched.

weather-skills/mrms-hourly:
  adapter: weather_skills
  provider: weather-skills
  skill: dynamical-fetch
  end_exclusive: true
  argv: ["--dataset", "noaa-mrms-conus-analysis-hourly", "--start-time", "{start}", "--end-time", "{end}", "--bbox", "{bbox}", "-v", "{variable}"]
  probe_latest: true
  variables:
    precip: {native_name: precipitation_surface, units: "mm/day", target_units: "mm/day"}
  grid:
    lat_res: 0.01
    lon_res: 0.01
    hindcast_range: [2020, 2026]
    temporal: hourly
  notes: >-
    Rhiza weather-skills dynamical-fetch: NOAA MRMS hourly precipitation analysis. CONUS
    ONLY: an African bbox returns an empty selection; catalogued for completeness. Call
    with hindcast=(y, y) and months=[...]; without hindcast the trailing 10 days are
    fetched.

weather-skills/chirps-daily:
  adapter: weather_skills
  provider: weather-skills
  skill: chirps-fetch
  argv: ["--start-time", "{start}", "--end-time", "{end}"]
  window_days: 10
  probe_latest: true
  variables:
    precip: {native_name: precip, units: "mm/day", target_units: "mm/day"}
  grid:
    lat_res: 0.05
    lon_res: 0.05
    hindcast_range: [1998, 2026]
    temporal: daily
  notes: >-
    CHIRPS daily via Rhiza weather-skills chirps-fetch (final product with preliminary
    fallback for recent days). Their skill has no --bbox and loads the full global 0.05
    deg grid (~104 MB/day); acmaddl fetches it in 10-day chunks and crops each to the
    region as it loads. Call with months= or a short hindcast; without hindcast the
    trailing 10 days are fetched. Native obs/chirps-v3-daily is the range-read route.

weather-skills/imerg-daily:
  adapter: weather_skills
  credentials: earthdata
  provider: weather-skills
  skill: imerg-fetch
  argv: ["--start-time", "{start}", "--end-time", "{end}", "--version", "late"]
  window_days: 10
  probe_latest: true
  variables:
    precip: {native_name: precip, units: "mm/day", target_units: "mm/day"}
  grid:
    lat_res: 0.1
    lon_res: 0.1
    hindcast_range: [2000, 2026]
    temporal: daily
  notes: >-
    IMERG daily (late run, ~4-day lag) via Rhiza weather-skills imerg-fetch. Needs NASA
    Earthdata Login token (~/.earthdatarc or EARTHDATA_TOKEN; username/password refused) and the
    GES DISC application approved on the account. No --bbox upstream:
    fetched in 10-day chunks and cropped per chunk. weather-skills/imerg-daily is the late run;
    weather-skills/imerg-daily-final the final run.

weather-skills/imerg-daily-final:
  adapter: weather_skills
  credentials: earthdata
  provider: weather-skills
  skill: imerg-fetch
  argv: ["--start-time", "{start}", "--end-time", "{end}", "--version", "final"]
  window_days: 10
  probe_latest: true
  variables:
    precip: {native_name: precip, units: "mm/day", target_units: "mm/day"}
  grid:
    lat_res: 0.1
    lon_res: 0.1
    hindcast_range: [2000, 2026]
    temporal: daily
  notes: >-
    IMERG daily (final run) via Rhiza weather-skills imerg-fetch. Needs NASA Earthdata
    credentials (EARTHDATA_USERNAME/PASSWORD or .netrc). No --bbox upstream: fetched in
    10-day chunks and cropped per chunk. weather-skills/imerg-daily is the late run; weather-skills/imerg-
    daily-final the final run.

weather-skills/era5:
  adapter: weather_skills
  provider: weather-skills
  skill: arco-era5-fetch
  argv: ["--start-time", "{start}", "--end-time", "{end}", "--bbox", "{bbox}", "-v", "{variable}"]
  probe_latest: true
  variables:
    precip: {native_name: total_precipitation, units: "mm/day", target_units: "mm/day"}
    temp: {native_name: 2m_temperature, units: C, target_units: C}
    sst: {native_name: sea_surface_temperature, units: C, target_units: C}
  grid:
    lat_res: 0.25
    lon_res: 0.25
    hindcast_range: [1940, 2026]
    temporal: hourly
  notes: >-
    ERA5 reanalysis from the public ARCO-ERA5 Zarr (Google Cloud) via Rhiza weather-
    skills arco-era5-fetch, credential-free (obs/era5 needs CDS credentials). Hourly;
    aggregate downstream. Keep windows short (months=).

weather-skills/oisst-daily:
  adapter: weather_skills
  provider: weather-skills
  skill: oisst-fetch
  argv: ["--start-time", "{start}", "--end-time", "{end}", "--bbox", "{bbox}"]
  probe_latest: true
  variables:
    sst: {native_name: sst, units: C, target_units: C}
  grid:
    lat_res: 0.25
    lon_res: 0.25
    hindcast_range: [1981, 2026]
    temporal: daily
  notes: >-
    NOAA OISST v2.1 daily SST via Rhiza weather-skills oisst-fetch (NOAA PSL OPeNDAP,
    credential-free). Degrees C, land NaN. obs/oisst-v2-highres is the monthly route.

weather-skills/smap-daily:
  adapter: weather_skills
  credentials: earthdata
  provider: weather-skills
  skill: smap-fetch
  argv: ["--start-time", "{start}", "--end-time", "{end}", "--bbox", "{bbox}", "--overpass", "AM"]
  requires_region: true
  probe_latest: true
  variables:
    soil_moisture: {native_name: soil_moisture, units: "m3/m3", target_units: "m3/m3"}
  grid:
    lat_res: 0.09
    lon_res: 0.09
    hindcast_range: [2015, 2026]
    temporal: daily
  notes: >-
    NASA SMAP SPL3SMP_E 9 km daily volumetric soil moisture (AM overpass) via Rhiza
    weather-skills smap-fetch. Needs Earthdata credentials. A region is required (their
    skill reads bounded granules).

weather-skills/cmip6:
  adapter: weather_skills
  provider: weather-skills
  skill: cmip6-fetch
  argv: ["--model", "GFDL-CM4", "--experiment", "ssp245", "--table", "Amon", "--start-time", "{start}", "--end-time", "{end}", "--bbox", "{bbox}", "-v", "{variable}"]
  allow_future: true
  variables:
    precip: {native_name: pr, units: "mm/day", target_units: "mm/day"}
    temp: {native_name: tas, units: C, target_units: C}
  grid:
    lat_res: 1.0
    lon_res: 1.25
    hindcast_range: [2015, 2100]
    temporal: monthly
  notes: >-
    CMIP6 projection via Rhiza weather-skills cmip6-fetch (Pangeo Google Cloud,
    credential-free), pinned to GFDL-CM4 / ssp245 / Amon. Other model-scenario pairs are
    a copied catalog block with different argv. Monthly; future years allowed.
    Request at least two months: their skill needs two time points to stamp the interval.
