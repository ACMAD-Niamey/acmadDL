# Final release of the OLD distribution name.
#
# `pip install accord-rosetta` resolves here, and this package's only job is to
# depend on `acmadDL` — the renamed distribution — so existing pins keep
# resolving to maintained code instead of silently freezing at 0.1.15.
#
# It ships no modules of its own. The deprecated `import rosetta` alias lives in
# the acmadDL wheel itself (src/rosetta/__init__.py at the repo root), so it
# arrives either way: via this redirect, or via a direct `pip install acmadDL`.
#
# Publish ONCE, by hand, from this directory — it is deliberately outside the
# root project so `uv build` at the repo root only ever builds acmadDL:
#     cd packaging/accord-rosetta && uv build && uv publish
[project]
name = "accord-rosetta"
version = "0.2.0"
description = "Deprecated — accord-rosetta has been renamed to acmadDL. Installs acmadDL."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "accord-research" }]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = ["acmadDL>=0.2.0"]

[project.urls]
Homepage = "https://github.com/ACMAD-Niamey/acmadDL"
Repository = "https://github.com/ACMAD-Niamey/acmadDL"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Metadata-only package: there are no modules to select.
bypass-selection = true
